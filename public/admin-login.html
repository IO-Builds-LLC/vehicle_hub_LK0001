<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - VehicleHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header>
    <a href="/" class="logo">
      <i class="fa-solid fa-car-side"></i> VehicleHub
    </a>
    <nav>
      <a href="/"><i class="fa-solid fa-house"></i> Home</a>
    </nav>
  </header>

  <main class="container">
    <div class="card" style="max-width: 450px;">
      <div class="profile-header-icon" style="color: var(--accent-primary);">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h2 class="card-title">Administrator Login</h2>
      
      <div id="loginError" class="alert alert-danger hidden"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Admin username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Admin password" required autocomplete="current-password">
        </div>

        <div class="btn-group" style="margin-top: 30px; width: 100%;">
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            <i class="fa-solid fa-right-to-bracket"></i> Login Dashboard
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Vehicle Registration Hub. All rights reserved.</p>
  </footer>

  <script>
    // Check if session is already active
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/admin/check-session');
        const data = await res.json();
        if (data.isAdmin) {
          window.location.href = '/admin.html';
        }
      } catch (err) {
        console.error('Session check failed', err);
      }
    });

    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = '/admin.html';
        } else {
          loginError.textContent = data.error || 'Invalid credentials.';
          loginError.classList.remove('hidden');
        }
      } catch (err) {
        console.error(err);
        loginError.textContent = 'Server connection error. Please try again.';
        loginError.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
